name: Agent — Analyzer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: analyzer_runs.id
        required: true
      limit:
        description: Max leads to analyze
        required: true
        default: "200"
      lead_id:
        description: Optional single lead UUID
        required: false
        default: ""

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r agents/requirements-analyzer.txt

      - name: Install Playwright browser
        run: python3 -m playwright install chromium --with-deps

      - name: Run analyzer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYZER_LIMIT: ${{ inputs.limit }}
          ANALYZER_LEAD_ID: ${{ inputs.lead_id }}
          ANALYZER_MAX_WORKERS: "1"
        run: python3 agents/analyzer/main.py "${{ inputs.run_id }}" "${{ inputs.limit }}"
