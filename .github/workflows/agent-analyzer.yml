name: Agent — Analyzer

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: analyzer_runs.id
        required: true
      limit:
        description: Max leads to analyze
        required: true
        default: "200"
      lead_id:
        description: Optional single lead UUID
        required: false
        default: ""

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Only lighthouse is needed from Node (not the full Next app).
      - name: Install Lighthouse CLI
        run: npm install --global lighthouse@13

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r agents/requirements-analyzer.txt

      - name: Install Playwright browser
        run: python3 -m playwright install chromium --with-deps

      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret DATABASE_URL (Neon pooled connection string)."
            exit 1
          fi

      - name: Mark run queued
        if: ${{ inputs.run_id != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DATABASE_URL"])
          with conn.cursor() as cur:
              cur.execute(
                  """update analyzer_runs
                     set status = 'running',
                         current_business = 'GitHub Actions worker starting…',
                         error = null
                     where id = %s""",
                  (os.environ["RUN_ID"],),
              )
          conn.commit()
          conn.close()
          PY

      - name: Run analyzer
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANALYZER_LIMIT: ${{ inputs.limit }}
          ANALYZER_LEAD_ID: ${{ inputs.lead_id }}
          ANALYZER_MAX_WORKERS: "1"
          PATH: /usr/local/bin:${{ env.PATH }}
        run: python3 agents/analyzer/main.py "${{ inputs.run_id }}" "${{ inputs.limit }}"

      - name: Mark run failed
        if: failure() && inputs.run_id != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import os, psycopg2
          url = (os.environ.get("DATABASE_URL") or "").strip()
          if not url:
              raise SystemExit(0)
          conn = psycopg2.connect(url)
          with conn.cursor() as cur:
              cur.execute(
                  """update analyzer_runs
                     set status = 'failed',
                         error = coalesce(nullif(error, ''), 'GitHub Actions job failed — see Actions → Agent — Analyzer logs.'),
                         finished_at = now()
                     where id = %s and status = 'running'""",
                  (os.environ["RUN_ID"],),
              )
          conn.commit()
          conn.close()
          PY
