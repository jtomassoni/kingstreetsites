name: Agent — Prospector

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: prospector_runs.id
        required: true
      zip:
        description: ZIP code or ALL
        required: true
      metro:
        description: Metro name
        required: true
        default: Denver

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r agents/requirements-prospector.txt

      - name: Check secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret DATABASE_URL (Neon pooled connection string)."
            exit 1
          fi
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "::error::Missing GitHub Actions secret GOOGLE_PLACES_API_KEY."
            exit 1
          fi

      - name: Run prospector
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: python3 agents/prospector/main.py "${{ inputs.zip }}" "${{ inputs.metro }}" "${{ inputs.run_id }}"

      - name: Mark run failed
        if: failure() && inputs.run_id != ''
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 - <<'PY'
          import os, psycopg2
          url = (os.environ.get("DATABASE_URL") or "").strip()
          if not url:
              raise SystemExit(0)
          conn = psycopg2.connect(url)
          with conn.cursor() as cur:
              cur.execute(
                  """update prospector_runs
                     set status = 'failed',
                         error = coalesce(nullif(error, ''), 'GitHub Actions job failed — see Actions → Agent — Prospector logs.'),
                         finished_at = now()
                     where id = %s and status = 'running'""",
                  (os.environ["RUN_ID"],),
              )
          conn.commit()
          conn.close()
          PY
